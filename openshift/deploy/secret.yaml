apiVersion: v1
kind: Secret
metadata:
  name: shaman-secrets
  namespace: shaman
type: Opaque
stringData:
  # PostgreSQL 
  SHAMAN_DB_USER: "shaman"
  SHAMAN_DB_PASS: "shaman"
  SHAMAN_DB_NAME: "shaman"

  # Shaman runtime (read by the app container)
  DATABASE_URL: "postgresql+psycopg2://shaman:shaman@postgres:5432/shaman"

  # Shaman API Basic-Auth
  SHAMAN_API_USER: "admin"
  SHAMAN_API_KEY:  "secret"

  # RabbitMQ
  RABBITMQ_URL: "amqp://shaman:shaman@rabbitmq:5672/%2f"

  # Optional: webhook secret used by shaman/auth.py (leave blank if unused)
  GITHUB_SECRET: ""
