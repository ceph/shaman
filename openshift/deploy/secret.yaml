apiVersion: v1
kind: Secret
metadata:
  name: shaman-secrets
  namespace: shaman
type: Opaque
stringData:
  # ----------------------------
  # PostgreSQL (for SCLorg image)
  # ----------------------------
  # These three keys are read by the postgres Deployment:
  #   POSTGRESQL_USER / POSTGRESQL_PASSWORD / POSTGRESQL_DATABASE
  # The SCLorg entrypoint uses them to initialize the DB. 
  # Ref: SCLorg Postgres docs & Dockerfile comments. 
  #      https://github.com/sclorg/postgresql-container (env vars)
  #      https://github.com/sclorg/postgresql-container/blob/master/16/Dockerfile.c9s
  #      (data dir is /var/lib/pgsql/data)
  SHAMAN_DB_USER: "shaman"        # <-- set to your desired DB username
  SHAMAN_DB_PASS: "shaman"        # <-- set a strong password
  SHAMAN_DB_NAME: "shaman"        # <-- your database name

  # ------------------------------------------
  # Shaman runtime (read by the app container)
  # ------------------------------------------
  # SQLAlchemy URL must match the three values above + 'postgres' Service @ 5432
  # Using psycopg2 dialect:
  DATABASE_URL: "postgresql+psycopg2://shaman:shaman@postgres:5432/shaman"

  # Shaman API Basic-Auth
  SHAMAN_API_USER: "admin"
  SHAMAN_API_KEY:  "secret"

  # Message bus (RabbitMQ via pika)
  RABBITMQ_URL: "amqp://shaman:shaman@rabbitmq:5672/%2f"

  # Optional: webhook secret used by shaman/auth.py (leave blank if unused)
  GITHUB_SECRET: ""
